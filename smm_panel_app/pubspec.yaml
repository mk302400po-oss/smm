name: smm_panel_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Backend & Database
  supabase_flutter: ^2.7.0
  
  # Notifications
  awesome_notifications: ^0.10.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^17.2.4
  onesignal_flutter: ^5.3.5
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  lottie: ^3.3.0
  
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.0

flutter_launcher_icons:
  android: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0A0F29"
  adaptive_icon_foreground: "assets/logo.png"

flutter_native_splash:
  color: "#0A0F29"
  background_image: assets/splash.png
  android: true
  android_12:
    color: "#0A0F29"
    background_image: assets/splash.png
  fullscreen: true
  android_gravity: center

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo.png
    - assets/splash.png
    - .env
